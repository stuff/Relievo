name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Which component, and what you see. A screenshot helps for anything visual.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: A minimal snippet, or a Storybook story that shows it. Steps for the keyboard or the screen reader if that is what fails.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Relievo version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and React version
      description: The theme (light, dark, system) too, when it matters.
      placeholder: Chrome 140, React 19.3, dark
    validations:
      required: true
